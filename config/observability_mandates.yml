# Mandatos de OBSERVABILIDADE (rastreamento/AIS) — normas que alteram o que se
# VÊ, não o que se FAZ. Categoria nova do Knowledge Base (docs/phase1_report.md
# §12). Fonte da lista: página oficial do MPA "Atos normativos que tratam da
# obrigatoriedade de adesão ao PREPS" (acesso 2026-09-11) + Portaria GM/MPA
# 484/2025 (consolidação; DOU recuperado em data/legal/observability/).
# ATENÇÃO: PREPS é rastreamento por SATÉLITE (VMS), NÃO é AIS. Nenhum dado
# PREPS é público na API do GFW (404 em 2026-09-11) — pedido institucional.
# Textos integrais das normas abaixo ainda NÃO recuperados (metadados da
# página do MPA); retrieved: false até download oficial + checksum.
